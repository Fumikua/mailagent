[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailagent"
version = "0.1.0"
description = "A safe, auditable mail automation runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aioimaplib>=1.1,<2",
  "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1",
  "arq>=0.26,<1",
  "click>=8.1,<9",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6,<7",
  "python-dotenv>=1.0,<2",
  "redis>=5,<6",
  "rich>=13.7,<14",
  "sqlalchemy[asyncio]>=2.0,<3",
  "tenacity>=8,<10",
  "uvicorn[standard]>=0.30,<1",
  "pgvector>=0.3,<1",
]

[project.scripts]
mailagent = "mailagent.infra.cli:main"

[project.entry-points."mailagent.verticals"]
example-triage = "mailagent.verticals.example_triage.plugin:plugin"

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "types-jsonschema>=4.23,<5",
  "types-PyYAML>=6,<7",
]
postgres = ["asyncpg>=0.29,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/mailagent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

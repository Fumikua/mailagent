[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailagent-example-plugin"
version = "0.1.0"
description = "Business-neutral template for an installable MailAgent vertical plugin."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mailagent>=0.1.0,<0.2",
]

[project.entry-points."mailagent.verticals"]
example-plugin = "mailagent_example_plugin.plugin:plugin"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mailagent_example_plugin"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

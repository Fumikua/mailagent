services:
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn mailagent.api.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    environment:
      MAILAGENT_DATABASE_URL: postgresql+asyncpg://mailagent:mailagent@postgres:5432/mailagent
      MAILAGENT_REDIS__URL: redis://redis:6379/0
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./taxonomy.yaml:/app/taxonomy.yaml:ro
      - ./verticals:/app/verticals:ro
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python -m mailagent.infra.worker
    environment:
      MAILAGENT_DATABASE_URL: postgresql+asyncpg://mailagent:mailagent@postgres:5432/mailagent
      MAILAGENT_REDIS__URL: redis://redis:6379/0
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./taxonomy.yaml:/app/taxonomy.yaml:ro
      - ./verticals:/app/verticals:ro
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mailagent
      POSTGRES_USER: mailagent
      POSTGRES_PASSWORD: mailagent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailagent -d mailagent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
